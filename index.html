<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d6a3e">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Week on a Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar over one working pane; week = responsive grid of day cards, shopping = docket-style price table */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --sunk:#e9eee6; --ink:#1c2a21; --muted:#5a6a5f; --line:#d6dfd2;
  --leaf:#2d6a3e; --leaf-ink:#ffffff; --leaf-soft:#dcebdf; --citrus:#f2d36b; --citrus-ink:#3d3000; --tomato:#b8412c; --tomato-soft:#f6e0da;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#19221c; --sunk:#141c16; --ink:#e5eee6; --muted:#9bab9f; --line:#2b3a2f;
  --leaf:#7cc48d; --leaf-ink:#0e1a11; --leaf-soft:#22382a; --citrus:#e9c54e; --citrus-ink:#211a00; --tomato:#f08a72; --tomato-soft:#3a221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#19221c; --sunk:#141c16; --ink:#e5eee6; --muted:#9bab9f; --line:#2b3a2f;
  --leaf:#7cc48d; --leaf-ink:#0e1a11; --leaf-soft:#22382a; --citrus:#e9c54e; --citrus-ink:#211a00; --tomato:#f08a72; --tomato-soft:#3a221d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 6px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.02em}
h1 span{color:var(--leaf)}
.hdr-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--leaf)}
.sync.err .dot{background:var(--tomato)}
.total{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.total b{color:var(--ink);font-weight:500;font-size:1rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{font:600 .9rem var(--f-body);border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--leaf)}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0}
.lead{color:var(--muted);max-width:65ch;margin:4px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.btn{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.small{padding:4px 8px;font-size:.8rem}
.btn:focus-visible,select:focus-visible,input:focus-visible,nav.tabs button:focus-visible,.chip:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day header{display:flex;justify-content:space-between;align-items:baseline}
.day header .d{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.day header .c{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.slot{display:flex;flex-direction:column;gap:3px}
.slot .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.slot select{width:100%;font:500 .9rem var(--f-body);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);min-width:0}
.slot .meta{font-size:.76rem;color:var(--muted)}
.slot.school{background:var(--leaf-soft);margin:0 -6px;padding:6px;border-radius:8px}
.reroll{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 4px}
.reroll:hover{color:var(--leaf)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .75rem var(--f-body);padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.tag{display:inline-block;font:600 .68rem var(--f-body);padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.tag.warn{background:var(--tomato-soft);color:var(--tomato)}
.tag.ok{background:var(--leaf-soft);color:var(--leaf)}
.tag.preg{background:var(--citrus);color:var(--citrus-ink)}
.avoid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;padding:0;margin:0;list-style:none}
.avoid li{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.9rem}
.avoid li b{display:block}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.member{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:8px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0}
.member .chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.member .sub{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date]{font:500 .95rem var(--f-body);padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);width:100%;min-width:0}
label.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
label.check input{margin-top:3px;accent-color:var(--leaf)}
.note{font-size:.82rem;color:var(--muted);max-width:65ch}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px dashed var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sec td{background:var(--sunk);font-family:var(--f-display);font-weight:600;font-size:.85rem;border-bottom:1px solid var(--line)}
td.best{background:var(--citrus);color:var(--citrus-ink)}
tr.have td{opacity:.45}
tr.have td:first-child{opacity:1}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tot .v{font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.tot.win{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.shoplinks{display:flex;gap:4px}
.shoplinks .btn{text-decoration:none;white-space:nowrap}
table{min-width:760px}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:500 .9rem var(--f-body);padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer;min-width:0}
.pick span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pick:hover{border-color:var(--leaf)}
.pick:focus-visible,#pkSearch:focus-visible,.pk-item:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sheet-bg[hidden],[hidden]{display:none!important}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pkSearch{font:500 1rem var(--f-body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);width:100%}
.pk-list{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.pk-item{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:9px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink);font:500 .95rem var(--f-body);cursor:pointer}
.pk-item:hover{background:var(--sunk)}
.pk-item[aria-current="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.boxday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.boxday .top{display:flex;justify-content:space-between;align-items:baseline}
.boxday .d{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.boxday .c{font:400 .78rem var(--f-mono);color:var(--muted)}
.boxrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center}
.boxrow select{width:100%;font:500 .86rem var(--f-body);padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);min-width:0}
.boxrow .mainname{font-weight:600;font-size:.88rem}
details.note summary{cursor:pointer;color:var(--leaf);font-weight:600}
details.note ol{margin:6px 0 0;padding-left:18px}
details.note li{margin-bottom:4px}
.boxline{font-size:.78rem;color:var(--ink);margin-top:2px}
.boxline .label{display:block;margin-bottom:1px}
.snack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.snack{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.snack .top{display:flex;justify-content:space-between;align-items:center}
.snack select{width:100%;font:500 .9rem var(--f-body);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);min-width:0}
.snack .meta{font:400 .78rem var(--f-mono);color:var(--muted)}
.snackrow{align-items:center}
.snackrow input{width:70px}
.ess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.ess-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.switch{display:flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer}
.switch input{accent-color:var(--leaf);width:18px;height:18px}
.ess-total{font:500 .9rem var(--f-mono);color:var(--leaf)}
.ess-list{display:flex;flex-direction:column}
.dim{opacity:.45}
.ess-row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name name" "qty cost" "act act";gap:4px 10px;padding:9px 0;border-top:1px dashed var(--line)}
.ess-name{grid-area:name;display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-width:0}
.ess-name input{accent-color:var(--leaf);margin-top:3px;width:17px;height:17px;flex:none}
.ess-name small{display:block;color:var(--muted);font-size:.78rem}
.ess-qty{grid-area:qty;display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.ess-qty input{width:76px}
.ess-cost{grid-area:cost;font:400 .82rem var(--f-mono);color:var(--muted);align-self:center;text-align:right}
.ess-act{grid-area:act;display:flex;gap:12px}
.linkbtn{border:0;background:none;color:var(--leaf);font:600 .8rem var(--f-body);padding:0;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.dogbox{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dogrow{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.92rem}
.ess-add summary{cursor:pointer;color:var(--leaf);font-weight:600;font-size:.88rem;padding-top:6px}
.ess-add form{margin-top:8px}
.lo{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.lo:first-of-type{border-top:0;padding-top:0}
.lo-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lo select{font:500 .88rem var(--f-body);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);min-width:0;flex:1 1 180px}
.stepper.sm button{width:32px;height:32px;font-size:1rem}
.stepper.sm output{font-size:1.1rem}
b.neg{color:var(--tomato)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:14px}
.segbtn{border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);padding:7px 18px;border-radius:999px;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink)}
.segbtn:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wktabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.wktabs .chip{padding:6px 12px;font-size:.85rem}
.wkc{font:400 .75rem var(--f-mono);opacity:.85}
.ing-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ing-tools input{flex:1 1 220px;font:500 1rem var(--f-body);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.ing-tools select{font:500 .95rem var(--f-body);padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
table.ingtable{min-width:520px}
.ihint{grid-column:1/-1;font-size:.76rem;color:var(--muted);margin-top:-2px}
.ro{font:500 .95rem var(--f-body);padding:7px 0;color:var(--muted)}
.recipe-sheet{max-width:620px}
.rv-body{overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.rv-meta{font:400 .8rem var(--f-mono);color:var(--muted)}
.serves{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:10px 12px}
.serves .label{margin-right:auto}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.2rem var(--f-body);cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper output{min-width:2.5ch;text-align:center;font:600 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.rv-ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rv-ing li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.rv-ing .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.rv-ing .sw{color:var(--muted);font-size:.78rem;display:block}
.rv-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.55}
.view-recipe{border:0;background:none;color:var(--leaf);font:600 .78rem var(--f-body);padding:2px 0;cursor:pointer;text-align:left}
.view-recipe:hover{text-decoration:underline}
.pk-sep{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px;border-top:1px solid var(--line);margin-top:6px}
.pk-item.off{color:var(--muted)}
.pk-item .warnline{color:var(--tomato)}
.pk-item small{color:var(--muted);font:400 .78rem var(--f-mono);white-space:nowrap}
.pk-item .why{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.recipe ul{margin:0;padding-left:18px;font-size:.86rem}
.recipe p{margin:0;font-size:.88rem}
.recipe .tags{display:flex;flex-wrap:wrap;gap:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
a{color:var(--leaf)}
.rules li{margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld select,.irow select{font:500 .9rem var(--f-body);padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);min-width:0;width:100%}
textarea{font:500 .92rem var(--f-body);padding:8px 9px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);width:100%;resize:vertical}
.irows{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px 28px;gap:6px;align-items:center}
.irow .unit{font-size:.8rem;color:var(--muted)}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.sub-panel{border:1px dashed var(--leaf);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.err{color:var(--tomato);font-weight:600;margin:0}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Week on a <span>Plate</span></h1>
      <div class="hdr-right"><div class="total" id="hdrTotal"></div><div class="sync" id="sync" role="status"></div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="week" aria-selected="true">This week</button>
      <button role="tab" data-tab="left" aria-selected="false">Leftovers</button>
      <button role="tab" data-tab="ess" aria-selected="false">Essentials</button>
      <button role="tab" data-tab="house" aria-selected="false">Household</button>
      <button role="tab" data-tab="shop" aria-selected="false">Shopping list</button>
      <button role="tab" data-tab="recipes" aria-selected="false">Recipes</button>
      <button role="tab" data-tab="ing" aria-selected="false">Ingredients</button>
      <button role="tab" data-tab="preg" aria-selected="false">Pregnancy</button>
      <button role="tab" data-tab="stores" aria-selected="false">Stores &amp; school</button>

function ghDefaults(){

 if(h.endsWith(".github.io")){d.owner=h.split(".")[0];const seg=location.pathname.split("/").filter(Boolean)[0];if(seg&&!seg.includes("."))d.repo=seg}
 try{if(window.AndroidApp&&typeof AndroidApp.syncConfig==="function"){const c=JSON.parse(AndroidApp.syncConfig()||"{}");["owner","repo","token"].forEach(k=>{if(c[k])d[k]=c[k]})}}catch(e){}

function ghErrText(st){

 else if(kind==="saving"){el.classList.add("ok");el.innerHTML=`<span class="dot"></span>Syncing…`}

async function ghGet(){
 const r=await fetch(ghRepoUrl()+"/contents/"+GH_PATH,{headers:ghHeaders(),cache:"no-store"});
 if(r.status===404){
  const rr=await fetch(ghRepoUrl(),{headers:ghHeaders(),cache:"no-store"});
  if(rr.ok)return {missing:true};
  throw {status:rr.status===404?404:rr.status};
 }
 if(!r.ok)throw {status:r.status};
 const j=await r.json();
 let state=null;try{state=JSON.parse(b64dec(j.content)).state}catch(e){state=null}

async function ghPut(){
 const doc={app:"week-on-a-plate",version:1,updated:new Date().toISOString(),state:sharedState()};

async function ghPush(){
 if(!gh)return;
 if(ghBusy){ghAgain=true;return}
 ghBusy=true;ghShow("saving");
 try{
  for(let attempt=0;attempt<4;attempt++){
   const r=await ghPut();
   if(!r.conflict){ghDirty=false;ghOkAt=Date.now();ghShow("ok");break}
   /* someone else saved first: take their recipes too, then save ours on top */
   const res=await ghGet();
   if(res.missing)ghSha=null;else{ghSha=res.sha;if(res.state&&unionExtras(S,res.state)){syncCustom();render()}}
  }
 }catch(e){ghMsg=ghErrText(e&&e.status);ghShow("err")}
 finally{ghBusy=false;if(ghAgain){ghAgain=false;ghPush()}}
}
function ghQueue(ms){clearTimeout(ghTimer);ghTimer=setTimeout(ghPush,ms==null?1500:ms)}
function ghStart(){

 ghFirst=true;ghSha=null;renderHouse();ghShow("saving");ghPull(true);
 if(!ghStart.wired){
  ghStart.wired=true;
  setInterval(()=>{if(gh&&!document.hidden)ghPull()},45000);
  document.addEventListener("visibilitychange",()=>{if(gh&&!document.hidden)ghPull()});
  window.addEventListener("focus",()=>{if(gh)ghPull()});
  window.addEventListener("online",()=>{if(gh)ghPull(true)});
 }

}
async function ghConnect(owner,repo,token){

 if(!gh.owner||!gh.repo||!gh.token){gh=prev;return "Fill in your GitHub username, the repository name and the token."}
 try{const r=await fetch(ghRepoUrl(),{headers:ghHeaders(),cache:"no-store"});
  if(!r.ok){const m=ghErrText(r.status);gh=prev;return m}
  const j=await r.json();if(j.permissions&&j.permissions.push===false){gh=prev;return "This token can read the repository but not change it. It needs Contents: Read and write."}
 }catch(e){gh=prev;return "Couldn't reach GitHub. Check your internet connection and try again."}

async function connectShared(){

 if(!window.claude||typeof window.claude.use!=="function")return;
 let db=null;try{db=await window.claude.use("db")}catch(e){db=null}

  if(snap.metadata.hasPendingWrites)return;
  if(!snap.exists){sharedExists=false;setSync(canWrite?"empty":"ro");return}
  sharedExists=true;

  if(str===lastSent){setSync("ok");return}

  let extra=false;
  if(firstSnap){
   const have=new Set((st.custom||[]).map(r=>r.id));
   const mine=(S.custom||[]).filter(r=>!have.has(r.id));
   if(mine.length){st.custom=(st.custom||[]).concat(mine);extra=true}
   const ingIds=new Set(Object.keys(st.customIng||{}));
   Object.entries(S.customIng||{}).forEach(([k,v])=>{if(!ingIds.has(k)){st.customIng=st.customIng||{};st.customIng[k]=v;extra=true}});
  }

  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

  if(extra){lastSent="";push()}
 },()=>setSync("err"));
}

/* ---------- Logic ---------- */
function portion(age){age=+age||0;if(age<4)return .4;if(age<9)return .6;if(age<14)return .85;if(age<19)return 1.1;if(age<65)return 1;return .9}
function eaters(type,day){
 const ms=S.members;
 if(type==="s")return isSchoolDay(day)?ms.filter(m=>m.school):[];
 if(type==="a")return S.rules.adultLunch?(isSchoolDay(day)?ms.filter(m=>!m.school):ms):[];
 return ms;
}
function slotTypes(day){
 const t=["b"];
 if(isSchoolDay(day)&&S.members.some(m=>m.school))t.push("s");
 if(S.rules.adultLunch&&eaters("a",day).length)t.push("a");
 t.push("d");return t;
}
function needs(ms,type){
 const set=new Set(),swaps=new Set();let preg=false;
 ms.forEach(m=>m.d.forEach(id=>{const d=DIETS.find(x=>x.id===id);if(!d)return;d.x.forEach(a=>set.add(a));if(d.sw)swaps.add(d.sw);if(d.preg)preg=true}));
 if(type==="s"){if(S.rules.nutFree)set.add("nuts");if(S.rules.eggFree)set.add("egg")}
 return {excl:set,swaps,preg};
}
function resolve(r,nd){
 const ing=r.i.map(([id,q])=>{let x=id;nd.swaps.forEach(sw=>{if(SWAP[sw][x])x=SWAP[sw][x]});return [x,q,x!==id]});
 const al=new Set();ing.forEach(([id])=>C[id].a.forEach(a=>al.add(a)));
 const bad=[...al].filter(a=>nd.excl.has(a));
 return {ing,al:[...al],ok:bad.length===0,bad};
}
const MEAL_WORD={b:"breakfast",l:"lunch",d:"dinner"};
function whyNot(r,day,type){
 if(r.leftover){const st=loStatus(r.lid);return st&&st.left<0?[`Not enough leftovers: ${st.used} servings planned, ${st.l.serves} saved`]:[]}
 const want=type==="b"?"b":type==="d"?"d":"l";const out=[];
 if(r.m!==want)out.push(`Saved as a ${MEAL_WORD[r.m]} recipe`);
 const ms=eaters(type,day);
 ms.forEach(m=>{
  const nd=needs([m],"x");const al=resolve(r,nd).al;
  const hit=[...nd.excl].filter(a=>al.includes(a));
  if(hit.length)out.push(`Has ${hit.map(a=>ALLERGEN_LABEL[a].toLowerCase()).join(", ")}: not suitable for ${m.name}`);
  if(nd.preg&&PREG[r.id]?.avoid)out.push(`Pregnancy risk for ${m.name}`);
 });
 if(type==="s"){const al=resolve(r,needs(ms,"x")).al;
  if(S.rules.nutFree&&al.includes("nuts"))out.push("Has nuts: breaks the nut-aware school rule");
  if(S.rules.eggFree&&al.includes("egg"))out.push("Has egg: breaks the egg-aware class rule");}
 return out;
}
function pool(type,ms){
 const m=type==="b"?"b":type==="d"?"d":"l";const nd=needs(ms,type);
 return R.filter(r=>r.m===m&&resolve(r,nd).ok&&!(nd.preg&&PREG[r.id]?.avoid));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){
 const plan=allDays().map(()=>({}));
 ["b","s","a","d"].forEach(type=>{
  let bag=[];
  allDays().forEach(day=>{
   if(!slotTypes(day).includes(type))return;
   const p=pool(type,eaters(type,day));if(!p.length){plan[day][type]=null;return}
   if(!bag.length)bag=shuffle(p);
   plan[day][type]=bag.pop().id;
  });
 });
 /* keep leftovers you've already put on meals */
 if(Array.isArray(S.plan))S.plan.forEach((p,d)=>{if(p&&plan[d])Object.entries(p).forEach(([t,id])=>{if(id&&String(id).startsWith("lo:")&&RBY[id]&&slotTypes(d).includes(t))plan[d][t]=id})});
 S.plan=plan;
 pickSnacks();
 pickBoxes();
}
/* Make a fresh plan for one week of a month, keeping the other weeks */
function regenWeek(w){
 const keep={plan:S.plan,box:S.box,snacks:S.snacks};
 generate();
 const n=+S.rules.snackCount||0;
 weekDays(w).forEach(d=>{keep.plan[d]=S.plan[d];if(keep.box&&S.box)keep.box[d]=S.box[d]});
 if(keep.snacks&&S.snacks)for(let i=w*n;i<w*n+n;i++)keep.snacks[i]=S.snacks[i];
 S.plan=keep.plan;S.box=keep.box||S.box;S.snacks=keep.snacks||S.snacks;
}
/* Switch between a week and a month, keeping what's already planned */
function setWeeks(n){
 const old={plan:S.plan||[],box:S.box||[],snacks:S.snacks||[]};const per=+S.rules.snackCount||0;
 S.rules.weeks=n;generate();
 old.plan.slice(0,nDays()).forEach((p,d)=>{if(p&&Object.keys(p).length)S.plan[d]=p});
 if(S.box)old.box.slice(0,nDays()).forEach((b,d)=>{if(b)S.box[d]=b});
 if(S.snacks)old.snacks.slice(0,per*nWeeks()).forEach((x,i)=>{if(x)S.snacks[i]=x});
 viewWeek=Math.min(viewWeek,nWeeks()-1);if(shopRange!=="all"&&+shopRange>=nWeeks())shopRange="all";
}
function reroll(day,type){
 const p=pool(type,eaters(type,day)).filter(r=>r.id!==S.plan[day][type]);
 if(p.length)S.plan[day][type]=p[Math.floor(Math.random()*p.length)].id;
}
function unitCost(id){const c=C[id];return Math.min(...storePrices(c))/c.p}
function mealCost(day,type){
 const id=S.plan?.[day]?.[type];if(!id||!RBY[id])return 0;
 const ms=eaters(type,day);const nd=needs(ms,type);const f=ms.reduce((s,m)=>s+portion(m.age),0);
 return resolve(RBY[id],nd).ing.reduce((s,[x,q])=>s+unitCost(x)*q*f,0);
}
function rangeDays(r){return r==null||r==="all"?allDays():weekDays(+r)}
function shopping(range){
 const days=rangeDays(range==null?shopRange:range);const inR=new Set(days);
 const weeksIn=range==null&&shopRange==="all"||range==="all"?nWeeks():1;
 const tot={};
 const add=(id,q,why)=>{tot[id]=tot[id]||{q:0,why:new Set()};tot[id].q+=q;if(why)tot[id].why.add(why)};
 if(!S.plan)return [];
 days.forEach(day=>slotTypes(day).forEach(type=>{
  const id=S.plan[day]?.[type];if(!id||!RBY[id])return;
  const ms=eaters(type,day);const nd=needs(ms,type);const f=ms.reduce((s,m)=>s+portion(m.age),0);
  resolve(RBY[id],nd).ing.forEach(([x,q])=>add(x,q*f,RBY[id].n));
 }));
 const per=+S.rules.snackCount||0;const wks=[...new Set(days.map(d=>Math.floor(d/7)))];
 const sp=snackPacks();(S.snacks||[]).filter((_,i)=>per&&wks.includes(Math.floor(i/per))).forEach(id=>{const sn=SBY[id];if(sn)sn.i.forEach(([x,q])=>add(x,q*sp,"Adult snacks: "+sn.n))});
 if(boxOn()&&S.box){const k=schoolKids().length;S.box.forEach((b,d)=>{if(!b||!inR.has(d))return;BOX_PARTS.forEach(([g,i])=>{const it=BOXBY[b[g][i]];if(it)it.i.forEach(([x,q])=>add(x,q*k,"Lunchbox: "+it.n))})})}
 if(S.rules.crunch&&!boxOn()){const k=S.members.filter(m=>m.school).length;if(k){add("apple",k*3*wks.length,"Crunch & Sip fruit");add("banana",k*2*wks.length,"Crunch & Sip fruit")}}
 essAdd(add,wks.length);
 return Object.entries(tot).map(([id,v])=>{
  const c=C[id];const packs=Math.max(1,Math.ceil(v.q/c.p-1e-6));
  const prices=storePrices(c).map(p=>p*packs);const best=prices.indexOf(Math.min(...prices));
  return {id,c,q:v.q,packs,prices,best,why:[...v.why]};
 }).sort((a,b)=>a.c.s-b.c.s||a.c.n.localeCompare(b.c.n));
}
function fmtQ(q,u){
 if(u==="g")return q>=1000?(q/1000).toFixed(2).replace(/\.?0+$/,"")+" kg":Math.ceil(q)+" g";
 if(u==="ml")return q>=1000?(q/1000).toFixed(2).replace(/\.?0+$/,"")+" L":Math.ceil(q)+" ml";
 return (Math.round(q*10)/10)+"";
}

const money=v=>"$"+v.toFixed(2);
function searchTerm(c){return (c.q||c.n).replace(/\s*\(\d+\)/g,"").replace(/\s+\d+(\.\d+)?\s*(g|kg|ml|L)\b.*$/i,"").replace(/\s*\(frozen\)/i," frozen").trim()}
function shopLinks(c){const t=encodeURIComponent(searchTerm(c));

function saveIe(){
 readIe();const name=ie.n.trim();const pack=+ie.p;
 const prs=ie.pr.map(v=>v===""?null:+v);const known=ACTIVE.map(i=>prs[i]).filter(v=>v>0);
 if(!name)return "Give the ingredient a name.";

 const low=Math.min(...known);const pr=[0,0,0].map((_,i)=>prs[i]>0?prs[i]:(ACTIVE.includes(i)?low:(C[ie.id]?.pr[i]||0)));

 if(!ie.id){const id="x_"+Date.now().toString(36);S.customIng[id]=Object.assign({u:ie.u},rec);ie.id=id}

function copyText(txt){

function backupCode(){const bytes=new TextEncoder().encode(JSON.stringify(sharedState()));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return "WOAP1:"+btoa(bin)}
function readBackup(code){
 code=code.trim().replace(/\s+/g,"");if(!code.startsWith("WOAP1:"))throw new Error("That doesn't look like a Week on a Plate backup code. It should start with WOAP1:");
 const bin=atob(code.slice(6));const st=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));

 return st;

 if(t.id==="gen"){generate();save();render();return}
 if(t.dataset.rr){const[d,ty]=t.dataset.rr.split(",");reroll(+d,ty);save();render();return}
 if(t.id==="addM"){const id=Math.max(0,...S.members.map(m=>m.id))+1;S.members.push({id,name:"New person",age:30,school:false,d:[]});S.example=false;generate();save();render();return}
 if(t.dataset.del){S.members=S.members.filter(m=>m.id!=t.dataset.del);S.example=false;generate();save();render();return}
 if(t.dataset.diet){const m=S.members.find(m=>m.id==t.closest("[data-m]").dataset.m);const i=m.d.indexOf(t.dataset.diet);i<0?m.d.push(t.dataset.diet):m.d.splice(i,1);S.example=false;generate();save();render();return}
 if(t.dataset.rf){rFilter=t.dataset.rf;renderRecipes();return}
 if(t.id==="ghOn"){const o=$("#gh-owner").value,r=$("#gh-repo").value,k=$("#gh-token").value;ghForm={owner:o,repo:r,token:""};ghFormMsg="Connecting…";$("#ghMsg").textContent=ghFormMsg;
  ghConnect(o,r,k).then(err=>{ghFormMsg=err||"Connected. Your other devices will pick up changes within a minute.";renderHouse();if(err){$("#gh-token").value=k}});return}
 if(t.id==="ghNow"){ghFormMsg="";if(ghDirty)ghPush();else{ghSha=null;ghPull(true)}return}
 if(t.id==="ghOff"){ghDisconnect();ghFormMsg="Disconnected. This device keeps its own copy.";renderHouse();return}
 if(t.id==="bkCopy"){const code=backupCode();const box=$("#bkText");bkPending=false;
  const done=m=>{bkMsg=m;const el=$("#bkMsg");if(el)el.textContent=m};
  box.value=code;
  copyText(code).then(()=>done("Backup code copied. Paste it on your other device.")).catch(()=>{box.focus();box.select();done("Backup code is in the box above and selected. Copy it, then paste it on your other device.")});
  return}
 if(t.id==="bkLoad"){const code=$("#bkText").value;
  let st;try{st=readBackup(code)}catch(err){bkPending=false;bkMsg=code.trim()?(err.message.includes("WOAP1")||err.message.includes("incomplete")?err.message:"The backup code is damaged. Copy it again on the other device."):"Paste a backup code into the box first.";renderHouse();$("#bkText").value=code;return}
  if(!bkPending){bkPending=true;bkMsg="This replaces the household on this device. Tap again to confirm.";renderHouse();$("#bkText").value=code;return}
  bkPending=false;S=Object.assign(structuredClone(DEFAULT),S,st);S.custom=S.custom||[];S.customIng=S.customIng||{};S.have=S.have||{};
  syncCustom();if(!S.plan)generate();save();if(ref&&canWrite){sharedExists=true;lastSent="";push()}
  bkMsg="Backup loaded.";render();return}
 if(t.id!=="bkLoad"&&t.id!=="bkText"&&bkPending){bkPending=false}
 if(t.id==="reset"){const keep={custom:S.custom,customIng:S.customIng};S=Object.assign(structuredClone(DEFAULT),keep);generate();save();render();return}
 if(t.id==="copy"){
  const list=shopping().filter(x=>!S.have[x.id]);
  const txt=list.map(x=>`${x.c.n} × ${x.packs}  (${STORES[x.best]} ${money(x.prices[x.best])})`).join("\n");
  const msg=$("#copyMsg");
  copyText(txt).then(()=>{msg.textContent="Copied to your clipboard."}).catch(()=>{msg.innerHTML=`<textarea readonly style="width:100%;height:160px">${esc(txt)}</textarea>`;msg.querySelector("textarea").select()});
 }
});
document.addEventListener("submit",e=>{
 if(e.target.dataset.essadd){e.preventDefault();const k=e.target.dataset.essadd;const sec=ESS_SECS.find(x=>x.k===k);const g=id=>document.getElementById(id);
  const name=g("ea-n-"+k).value.trim(),pack=+g("ea-p-"+k).value,un=g("ea-u-"+k).value.trim()||"items",wk=+g("ea-w-"+k).value;
  const prs=[0,0,0];ACTIVE.forEach(i=>{prs[i]=+g(`ea-pr${i}-${k}`).value||0});const known=ACTIVE.map(i=>prs[i]).filter(v=>v>0);
  const fail=m=>{essMsg[k]=m;renderEss();document.querySelector(`[data-essadd="${k}"]`).closest("details").open=true};
  if(!name)return fail("Give it a name.");if(!(pack>0))return fail("Enter how many come in a pack.");if(!known.length)return fail("Enter a price for at least one store.");
  ACTIVE.forEach(i=>{if(!(prs[i]>0))prs[i]=Math.min(...known)});
  const id="x_"+Date.now().toString(36);S.customIng[id]={n:name,q:name,u:"ea",un,p:pack,pr:prs,s:sec.s,a:[]};essInit().items[id]={wk:Math.max(0,wk||0),on:true};
  essMsg[k]=`${name} added.`;syncCustom();save();render();return}
 if(e.target.id!=="loForm")return;e.preventDefault();
 const name=$("#lo-name").value.trim(),serves=Math.round(+$("#lo-serves").value),useBy=$("#lo-useby").value,notes=$("#lo-notes").value.trim();
 if(!name){loMsg="Say what the leftovers are.";$("#loMsg").textContent=loMsg;$("#lo-name").focus();return}
 if(!(serves>=1)){loMsg="Enter how many servings are left, 1 or more.";$("#loMsg").textContent=loMsg;$("#lo-serves").focus();return}
 S.leftovers=(S.leftovers||[]).concat([{id:Date.now().toString(36),name,serves:Math.min(40,serves),useBy,notes,added:todayISO()}]);
 loMsg=`${name} saved with ${serves} ${serves===1?"serving":"servings"}. Put it on a meal below.`;syncCustom();save();render();
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="ingSearch"){ingQ=t.value;renderIng();const n=$("#ingSearch");n.focus();n.setSelectionRange(n.value.length,n.value.length);return}
 if(t.dataset.dr&&draft){
  const f=t.dataset.dr,i=+t.dataset.i;
  if(f==="ing"){draft.rows[i].id=t.value;const u=$(`#dr-u-${i}`);if(u)u.textContent=t.value&&C[t.value]?UNIT_LABEL[C[t.value].u]:"";const hh=$(`#dr-h-${i}`);if(hh)hh.textContent=t.value?ingHint(t.value):""}
  else if(f==="q")draft.rows[i].q=t.value;
  else if(f==="preg")draft.preg=t.checked;
  else draft[f]=t.value;
 }
 if(t.dataset.ni&&niDraft){const f=t.dataset.ni;if(f==="pr")niDraft.pr[+t.dataset.i]=t.value;else niDraft[f]=t.value}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="ingSec"){ingSec=t.value;renderIng();return}
 if(t.dataset.esson){essInit().on[t.dataset.esson]=t.checked;save();render();return}
 if(t.dataset.essitem){essInit().items[t.dataset.essitem].on=t.checked;save();render();return}
 if(t.dataset.esswk){const v=Math.max(0,+t.value||0);essInit().items[t.dataset.esswk].wk=v;save();setTimeout(render,0);return}
 if(t.id==="ie-u"&&ie){readIe();renderIe();return}
 if(t.dataset.dr||t.dataset.ni){if(t.dataset.dr==="preg"&&draft)draft.preg=t.checked;if(t.dataset.dr==="ing"&&draft){draft.rows[+t.dataset.i].id=t.value;const u=$(`#dr-u-${t.dataset.i}`);if(u)u.textContent=t.value&&C[t.value]?UNIT_LABEL[C[t.value].u]:"";const hh=$(`#dr-h-${t.dataset.i}`);if(hh)hh.textContent=t.value?ingHint(t.value):""}return}
 if(t.dataset.sel){const[d,ty]=t.dataset.sel.split(",");S.plan[+d][ty]=t.value;save();render();return}
 if(t.dataset.have){S.have[t.dataset.have]=t.checked;save();renderShop();renderTotal();return}
 if(t.dataset.box){const[d,g,i]=t.dataset.box.split(",");S.box[+d][g][+i]=t.value;save();render();return}
 if(t.dataset.snack){S.snacks[+t.dataset.snack]=t.value;save();render();return}
 if(t.id==="r-snacks"){S.rules.snackCount=Math.max(0,Math.min(10,Math.round(+t.value||0)));pickSnacks();save();setTimeout(render,0);return}
 if(t.dataset.rule){S.rules[t.dataset.rule]=t.checked;generate();save();render();return}
 const row=t.closest("[data-m]");
 if(row&&t.dataset.f){
  const m=S.members.find(m=>m.id==row.dataset.m);
  if(t.dataset.f==="name")m.name=t.value.trim()||"Unnamed";
  if(t.dataset.f==="age"){m.age=Math.max(0,+t.value||0);if(m.age<4||m.age>18)m.school=false}
  if(t.dataset.f==="school")m.school=t.checked;
  S.example=false;generate();save();setTimeout(render,0);
 }
 if(t.id==="pc"){S.postcode=t.value;save();renderStores()}
});
syncCustom();
render();
connectShared();
/* On GitHub Pages: allow "Install as app" in Edge/Chrome and work offline */
if(location.hostname.endsWith(".github.io")){
 try{const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l)}catch(e){}
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
